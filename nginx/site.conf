server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript text/plain application/xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain application/json;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    error_page 404 /404.html;

    # add_header iç blokta tanımlanınca dıştakiler düşer; güvenlik başlıkları her blokta include edilir.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/guvenlik.conf;
    }

    # Adında içerik özeti olan görseller ve ?v=<özet> ile çağrılan CSS/JS: değişince adresi değişir.
    location /assets/img/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/guvenlik.conf;
    }
    location ~* ^/(style\.css|script\.js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/guvenlik.conf;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/guvenlik.conf;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/guvenlik.conf;
    }
}
